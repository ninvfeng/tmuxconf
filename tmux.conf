# =============================================
# tmuxconf —— 鼠标优先、为 CLI Agent 优化的 tmux 配置
# https://github.com/ninvfeng/tmuxconf
# 个人改动请写到 ~/.tmux.conf.local，升级不会覆盖
# =============================================

# =============================================
# 基本设置
# =============================================

# 默认 shell 用 zsh(存在时),避免新 session 落回 bash
if-shell '[ -x /bin/zsh ]' 'set -g default-shell /bin/zsh'
if-shell '[ -x /usr/bin/zsh ]' 'set -g default-shell /usr/bin/zsh'

# 开启鼠标支持
set -g mouse on

# 窗口和窗格索引从 1 开始
set -g base-index 1
setw -g pane-base-index 1

# 历史滚动行数
set -g history-limit 50000

# 256色 + 真彩色
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# 减少 ESC 延迟
set -sg escape-time 0

# 透传 Shift+Enter / Ctrl+Enter 等修饰键(需 tmux 3.2+),
# 否则 pi、Claude Code 等 TUI 里的换行快捷键收不到,启动还会告警
set -g extended-keys on

# 复制内容经 OSC 52 发给外层终端,VS Code Remote / SSH 下也能进本地剪贴板,
# 不依赖远端装 xclip
set -g set-clipboard on

# 自动重命名窗口
setw -g automatic-rename on
set -g renumber-windows on

# =============================================
# 快捷键
# =============================================

# 快速重载配置
bind r source-file ~/.tmux.conf \; display "✓ 配置已重载"

# 直观的分屏键
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Alt + 方向键切换窗格
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Alt + h/j/k/l vim 风格切换窗格
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# Shift + 方向键调整窗格大小
bind -n S-Left resize-pane -L 2
bind -n S-Right resize-pane -R 2
bind -n S-Up resize-pane -U 1
bind -n S-Down resize-pane -D 1

# =============================================
# 鼠标增强
# =============================================

# 状态栏左侧:点 [+] 新建窗口,点会话名打开会话列表
# 按坐标区分而不用 range=user,是为了兼容 tmux 3.2/3.3
bind -n MouseDown1StatusLeft if -F '#{e|<:#{mouse_x},3}' 'new-window -c "#{pane_current_path}"' 'choose-tree -Zs'

# 中键点击窗口名关闭窗口
bind -n MouseDown2Status kill-window -t=

# 双击窗格最大化/还原
bind -n DoubleClick1Pane resize-pane -Z

# 中键点击窗格垂直分屏
bind -n MouseDown2Pane split-window -h -c "#{pane_current_path}"

# 状态栏右侧只有最末的 [x] 关闭当前窗格,点到 CPU/时间上不会误关
bind -n MouseDown1StatusRight if -F '#{e|>=:#{mouse_x},#{e|-:#{client_width},3}}' 'kill-pane'

# =============================================
# 状态栏美化(Tokyo Night)
# =============================================

set -g status-position bottom
set -g status-justify left
set -g status-interval 1
set -g status-style "bg=#1a1b26,fg=#a9b1d6"

# 左侧: [+] 必须在最前 3 格,和上面的鼠标绑定对应
set -g status-left-length 40
set -g status-left "#[bg=#9ece6a,fg=#1a1b26,bold] + #[bg=#1a1b26] #[bg=#7aa2f7,fg=#1a1b26,bold] #S #[bg=#1a1b26] "

# 右侧: [x] 必须在最后 3 格,和上面的鼠标绑定对应
# 结尾的 #[default] 不能删:插件改写 status-right 时会吃掉末尾空格,[x] 就被挤到屏幕边缘
set -g status-right-length 100
set -g status-right "#[fg=#e0af68,bg=#3b4261] ↓#{download_speed} ↑#{upload_speed} #[fg=#9ece6a]CPU:#{cpu_percentage} #[fg=#bb9af7]RAM:#{ram_percentage} #[bg=#7aa2f7,fg=#1a1b26,bold] %m-%d %H:%M:%S #[bg=#f7768e,fg=#1a1b26,bold] x #[default]"

set -g window-status-format "#[fg=#a9b1d6,bg=#3b4261] #I #W "
set -g window-status-current-format "#[fg=#1a1b26,bg=#f7768e,bold] #I #W "
set -g window-status-separator " "

# 窗格边框
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# 消息样式
set -g message-style "bg=#7aa2f7,fg=#1a1b26,bold"
set -g message-command-style "bg=#3b4261,fg=#a9b1d6"

# =============================================
# 复制模式
# =============================================

setw -g mode-style "bg=#3b4261,fg=#a9b1d6"
setw -g mode-keys vi

# 鼠标拖选松手即复制
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# v 开始选择，y 复制
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# 双击选中单词,三击选中整行
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line

# =============================================
# 会话持久化(tmux-resurrect + tmux-continuum)
# =============================================

# prefix + Ctrl-s 手动保存,prefix + Ctrl-r 手动恢复
# 恢复时自动重新拉起这些程序
set -g @resurrect-processes 'ssh vi vim nvim tail less man pi claude codex "~node"'

# 每 15 分钟自动保存,tmux 服务启动时自动恢复上次的会话
# 有存档才开自动恢复,否则首次启动会弹 "Tmux resurrect file not found!"
set -g @continuum-save-interval '15'
if-shell '[ -e ~/.local/share/tmux/resurrect/last ] || [ -e ~/.tmux/resurrect/last ]' "set -g @continuum-restore 'on'"

# =============================================
# 插件
# =============================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-net-speed'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# 个人配置,放在 TPM 之前,这样里面也能加 @plugin
source-file -q ~/.tmux.conf.local

# 初始化 TPM(必须保持在文件最后一行)
run '~/.tmux/plugins/tpm/tpm'
